name: ARScav
options:
  bundleIdPrefix: studio.tav
  developmentTeam: KFT6N8T8J3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "ARScav uses the camera to find printed scavenger-hunt markers."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: studio.tav.arscav
    DEVELOPMENT_TEAM: KFT6N8T8J3
packages:
  LLM:
    url: https://github.com/eastriverlee/LLM.swift
    from: 1.8.0
targets:
  ARScav:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Hunt
      - path: AR
      - path: Content
        excludes:
          - "manifest.json"
      - path: UI
      - path: Resources
        buildPhase: resources
        type: group
    dependencies:
      - package: LLM
        product: LLM
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_NAME: ARScav
        DEVELOPMENT_TEAM: KFT6N8T8J3
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
